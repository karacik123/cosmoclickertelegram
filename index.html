<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cosmos Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #a78bfa;
            --accent-glow: rgba(167,139,250,0.5);
            --spring: cubic-bezier(0.34,1.56,0.64,1);
            --nav-h: 64px;
        }
        html, body {
            height:100%; width:100%;
            overflow:hidden; overscroll-behavior:none;
            -webkit-user-select:none; user-select:none;
            touch-action:none;
            -webkit-tap-highlight-color:transparent;
        }
        body {
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
            background:#050510; color:#fff;
            position:fixed; inset:0;
        }

        /* ═══ BACKGROUND ═══ */
        .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
        .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;will-change:transform}
        .orb--1{width:300px;height:300px;background:radial-gradient(circle,#7c3aed 0%,transparent 70%);top:-8%;left:-10%;animation:d1 13s ease-in-out infinite alternate}
        .orb--2{width:250px;height:250px;background:radial-gradient(circle,#06b6d4 0%,transparent 70%);bottom:-5%;right:-10%;animation:d2 17s ease-in-out infinite alternate}
        .orb--3{width:220px;height:220px;background:radial-gradient(circle,#ec4899 0%,transparent 70%);top:40%;left:50%;animation:d3 19s ease-in-out infinite alternate}
        .orb--4{width:200px;height:200px;background:radial-gradient(circle,#3b82f6 0%,transparent 70%);top:15%;right:5%;animation:d4 15s ease-in-out infinite alternate}
        .orb--5{width:180px;height:180px;background:radial-gradient(circle,#10b981 0%,transparent 70%);bottom:20%;left:5%;animation:d5 21s ease-in-out infinite alternate}
        @keyframes d1{to{transform:translate(55vw,35vh) scale(1.2)}}
        @keyframes d2{to{transform:translate(-45vw,-35vh) scale(1.15)}}
        @keyframes d3{to{transform:translate(-25vw,-40vh) scale(.85)}}
        @keyframes d4{to{transform:translate(-35vw,45vh) scale(1.3)}}
        @keyframes d5{to{transform:translate(40vw,-30vh) scale(1.1)}}

        /* ═══ SCREENS ═══ */
        .screen{
            position:absolute;inset:0;z-index:10;
            display:flex;flex-direction:column;align-items:center;
            padding:16px 20px;
            padding-top:calc(16px + env(safe-area-inset-top,0px));
            padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
            opacity:0;pointer-events:none;transition:opacity .3s ease;
            overflow-y:auto;
        }
        .screen.active{opacity:1;pointer-events:auto}

        /* ═══ BOTTOM NAV ═══ */
        .nav{
            position:fixed;bottom:0;left:0;right:0;
            height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
            padding-bottom:env(safe-area-inset-bottom,0px);
            background:rgba(255,255,255,.06);
            backdrop-filter:blur(24px) saturate(160%);
            -webkit-backdrop-filter:blur(24px) saturate(160%);
            border-top:1px solid rgba(255,255,255,.12);
            display:flex;align-items:center;justify-content:space-around;
            z-index:50;
        }
        .nav__btn{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:3px;background:none;border:none;color:rgba(255,255,255,.35);
            font-size:10px;font-weight:600;letter-spacing:.4px;
            cursor:pointer;padding:8px 20px;
            transition:color .2s ease;outline:none;
            -webkit-tap-highlight-color:transparent;
        }
        .nav__btn.active{color:var(--accent)}
        .nav__btn-icon{font-size:22px;line-height:1}

        /* ═══ GLASS CARD ═══ */
        .glass{
            background:rgba(255,255,255,.06);
            backdrop-filter:blur(20px) saturate(160%);
            -webkit-backdrop-filter:blur(20px) saturate(160%);
            border:1px solid rgba(255,255,255,.15);
            border-radius:22px;position:relative;overflow:hidden;
        }
        .glass::before{
            content:'';position:absolute;inset:0;border-radius:inherit;
            background:linear-gradient(155deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.02) 35%,transparent 55%);
            pointer-events:none;z-index:1;
        }

        /* ═══ HOME SCREEN ═══ */
        .home-score{
            font-size:72px;font-weight:900;line-height:1;
            margin-top:8px;font-variant-numeric:tabular-nums;
            z-index:2;position:relative;
        }
        .home-score.pop{animation:popS .15s var(--spring)}
        @keyframes popS{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
        .home-label{
            font-size:12px;text-transform:uppercase;letter-spacing:2.5px;
            opacity:.3;margin-bottom:4px;z-index:2;position:relative;font-weight:600;
        }
        .home-coins{
            font-size:18px;font-weight:700;color:var(--accent);
            margin-bottom:2px;z-index:2;position:relative;
        }
        .home-income{
            font-size:12px;opacity:.4;margin-bottom:12px;
            z-index:2;position:relative;font-weight:500;
        }
        .home-best{
            margin-top:16px;font-size:13px;opacity:.3;
            z-index:2;position:relative;font-weight:500;
        }
        .home-best span{font-weight:700;opacity:1;color:var(--accent)}
        .home-spacer{flex:1;display:flex;align-items:center;justify-content:center}

        /* ═══ LIQUID GLASS BUTTON (FIXED) ═══ */
        .lbtn{
            position:relative;width:220px;height:220px;
            border-radius:50%;cursor:pointer;
            touch-action:manipulation;-webkit-tap-highlight-color:transparent;
            outline:none;z-index:2;
            overflow:hidden;
            transition:transform .35s var(--spring);
        }
        .lbtn:active{transform:scale(.92)}

        /* Separate glass layer — backdrop-filter lives HERE, not on image parent */
        .lbtn__glass{
            position:absolute;inset:0;border-radius:50%;
            background:
                radial-gradient(ellipse 70% 50% at 35% 20%,rgba(255,255,255,.12) 0%,transparent 60%),
                rgba(255,255,255,.04);
            backdrop-filter:blur(10px) saturate(160%);
            -webkit-backdrop-filter:blur(10px) saturate(160%);
            border:1.5px solid rgba(255,255,255,.18);
            box-shadow:
                inset 0 2px 3px rgba(255,255,255,.2),
                inset 0 -3px 6px rgba(0,0,0,.08),
                0 10px 40px rgba(0,0,0,.25);
            overflow:hidden;z-index:1;
        }
        /* Top specular highlight on the glass layer */
        .lbtn__glass::before{
            content:'';position:absolute;
            top:5%;left:14%;right:14%;height:26%;
            border-radius:50%;
            background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.04) 60%,transparent 100%);
            pointer-events:none;z-index:2;
        }
        .lbtn__glass::after{
            content:'';position:absolute;
            bottom:8%;left:24%;right:24%;height:16%;
            border-radius:50%;
            background:radial-gradient(ellipse,rgba(255,255,255,.06) 0%,transparent 70%);
            pointer-events:none;z-index:2;
        }

        /* Image — ABOVE the glass layer, no backdrop-filter interference */
        .lbtn__img{
            position:absolute;top:5%;left:5%;width:90%;height:90%;
            border-radius:50%;object-fit:cover;object-position:center;
            pointer-events:none;z-index:3;
            filter:brightness(1.25) contrast(1.1);
            -webkit-user-drag:none;
        }

        /* Edge ring above image */
        .lbtn__edge{
            position:absolute;inset:1px;border-radius:50%;
            box-shadow:inset 0 0 12px rgba(255,255,255,.03),inset 0 0 1px rgba(255,255,255,.1);
            pointer-events:none;z-index:4;
        }
        /* Outer halo behind everything */
        .lbtn__halo{
            position:absolute;inset:-20px;border-radius:50%;
            background:radial-gradient(circle,var(--accent-glow) 0%,rgba(167,139,250,.12) 40%,transparent 65%);
            opacity:.2;pointer-events:none;z-index:0;
            animation:hPulse 3s ease-in-out infinite;
        }
        @keyframes hPulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.3;transform:scale(1.03)}}
        .lbtn:active .lbtn__halo{opacity:.6;animation:none}
        /* Flash */
        .lbtn__flash{
            position:absolute;inset:0;border-radius:50%;
            background:radial-gradient(circle,rgba(255,255,255,.4) 0%,rgba(255,255,255,.06) 40%,transparent 65%);
            opacity:0;pointer-events:none;z-index:5;
        }
        .lbtn__flash.fire{animation:flashB .3s ease-out forwards}
        @keyframes flashB{0%{opacity:.7;transform:scale(.7)}100%{opacity:0;transform:scale(1.1)}}
        /* Ripple */
        .ripple{
            position:absolute;border-radius:50%;background:rgba(255,255,255,.22);
            transform:scale(0);animation:ripO .5s ease-out forwards;
            pointer-events:none;z-index:6;
        }
        @keyframes ripO{to{transform:scale(3.5);opacity:0}}

        /* ═══ UPGRADES SCREEN ═══ */
        .upg-title{
            font-size:24px;font-weight:800;margin-top:12px;margin-bottom:20px;
            z-index:2;position:relative;
        }
        .upg-card{padding:24px;max-width:320px;width:100%;z-index:2;position:relative}
        .upg-card__name{font-size:18px;font-weight:700;margin-bottom:4px;position:relative;z-index:2}
        .upg-card__desc{font-size:13px;opacity:.5;margin-bottom:14px;position:relative;z-index:2;font-weight:500}
        .upg-card__level{font-size:14px;margin-bottom:14px;position:relative;z-index:2;font-weight:600}
        .upg-card__level span{color:var(--accent);font-weight:700}
        .upg-buy{
            width:100%;padding:14px;
            background:rgba(167,139,250,.12);
            border:1px solid rgba(167,139,250,.25);
            border-radius:14px;color:#fff;font-size:15px;font-weight:700;
            cursor:pointer;position:relative;z-index:2;
            transition:transform .2s var(--spring),opacity .2s ease,background .2s ease;
            outline:none;
        }
        .upg-buy:active:not(:disabled){transform:scale(.96)}
        .upg-buy:disabled{opacity:.3;cursor:not-allowed}
        .upg-buy:disabled::after{content:' — не хватает монет';font-weight:400;font-size:12px;opacity:.7}

        /* ═══ SETTINGS SCREEN ═══ */
        .set-title{
            font-size:24px;font-weight:800;margin-top:12px;margin-bottom:28px;
            z-index:2;position:relative;
        }
        .set-reset{
            padding:16px 40px;
            background:rgba(239,68,68,.12);
            border:1px solid rgba(239,68,68,.3);
            border-radius:16px;color:#ef4444;font-size:16px;font-weight:700;
            cursor:pointer;position:relative;z-index:2;
            transition:transform .2s var(--spring);outline:none;
        }
        .set-reset:active{transform:scale(.96)}

        /* ═══ MODAL ═══ */
        .modal{
            position:fixed;inset:0;z-index:100;
            display:flex;align-items:center;justify-content:center;
            opacity:0;pointer-events:none;transition:opacity .3s ease;
        }
        .modal.active{opacity:1;pointer-events:auto}
        .modal__bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
        .modal__card{
            position:relative;max-width:300px;width:88%;
            padding:28px 24px;text-align:center;
            background:rgba(30,20,50,.75);
            backdrop-filter:blur(28px) saturate(160%);
            -webkit-backdrop-filter:blur(28px) saturate(160%);
            border:1px solid rgba(255,255,255,.15);
            border-radius:22px;overflow:hidden;z-index:1;
        }
        .modal__card::before{
            content:'';position:absolute;inset:0;border-radius:inherit;
            background:linear-gradient(155deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.02) 35%,transparent 55%);
            pointer-events:none;z-index:1;
        }
        .modal__icon{font-size:40px;margin-bottom:12px;position:relative;z-index:2}
        .modal__text{
            font-size:15px;font-weight:700;line-height:1.4;
            margin-bottom:24px;position:relative;z-index:2;color:#ef4444;
        }
        .modal__actions{display:flex;gap:10px;position:relative;z-index:2}
        .modal__btn{
            flex:1;padding:13px 8px;border-radius:14px;
            font-size:14px;font-weight:700;cursor:pointer;
            border:none;outline:none;
            transition:transform .2s var(--spring),opacity .2s ease;
        }
        .modal__btn:active:not(:disabled){transform:scale(.96)}
        .modal__btn--cancel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff}
        .modal__btn--confirm{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444}
        .modal__btn:disabled{opacity:.3;cursor:not-allowed}

        /* ═══ RESPONSIVE ═══ */
        @media(max-height:650px){
            .lbtn{width:180px;height:180px}
            .home-score{font-size:56px}
        }
        @media(max-height:520px){
            .lbtn{width:140px;height:140px}
            .home-score{font-size:44px}
            .home-label{font-size:10px}
        }
        @media(min-height:800px){
            .lbtn{width:260px;height:260px}
        }
    </style>
</head>
<body>

<div class="bg">
    <div class="orb orb--1"></div><div class="orb orb--2"></div>
    <div class="orb orb--3"></div><div class="orb orb--4"></div><div class="orb orb--5"></div>
</div>

<!-- ═══ UPGRADES ═══ -->
<div id="scr-upg" class="screen">
    <div class="upg-title">Улучшения</div>
    <div class="upg-card glass">
        <div class="upg-card__name">⚡ Авто-клик</div>
        <div class="upg-card__desc">+1 нажатие/сек за каждый уровень</div>
        <div class="upg-card__level">Уровень: <span id="upg-level">0</span></div>
        <button class="upg-buy" id="upg-buy">Купить — 🪙 50</button>
    </div>
</div>

<!-- ═══ SETTINGS ═══ -->
<div id="scr-set" class="screen">
    <div class="set-title">Настройки</div>
    <button class="set-reset" id="reset-btn">Сбросить прогресс</button>
</div>

<!-- ═══ MODAL ═══ -->
<div class="modal" id="modal">
    <div class="modal__bg" id="modal-bg"></div>
    <div class="modal__card">
        <div class="modal__icon">⚠️</div>
        <div class="modal__text">ЭТО ПОЛНОСТЬЮ УДАЛИТ ВАШ ПРОГРЕСС!</div>
        <div class="modal__actions">
            <button class="modal__btn modal__btn--cancel" id="m-cancel">Отменить</button>
            <button class="modal__btn modal__btn--confirm" id="m-confirm" disabled>Продолжить (5)</button>
        </div>
    </div>
</div>

<!-- ═══ NAV ═══ -->
<div class="nav">
    <button class="nav__btn active" data-scr="scr-home">
        <span class="nav__btn-icon">🏠</span>Главная
    </button>
    <button class="nav__btn" data-scr="scr-upg">
        <span class="nav__btn-icon">⚡</span>Улучшения
    </button>
    <button class="nav__btn" data-scr="scr-set">
        <span class="nav__btn-icon">⚙️</span>Настройки
    </button>
</div>

<script>
(function(){
    'use strict';

    var LS_SCORE='ct_score', LS_BEST='ct_best', LS_COINS='ct_coins', LS_UPG='ct_upg';
    var SAVE_EVERY=5, BASE_COST=50, COST_MULT=1.1;

    var tg=window.Telegram&&window.Telegram.WebApp;

    /* DOM */
    var scoreEl=document.getElementById('score'),
        coinsEl=document.getElementById('coins'),
        incomeEl=document.getElementById('income'),
        bestEl=document.getElementById('best'),
        tapBtn=document.getElementById('tap'),
        flashEl=document.getElementById('flash'),
        upgLevel=document.getElementById('upg-level'),
        upgBuy=document.getElementById('upg-buy'),
        resetBtn=document.getElementById('reset-btn'),
        modal=document.getElementById('modal'),
        mCancel=document.getElementById('m-cancel'),
        mConfirm=document.getElementById('m-confirm');

    var navBtns=document.querySelectorAll('.nav__btn');
    var screens=document.querySelectorAll('.screen');

    /* State */
    var score=parseFloat(localStorage.getItem(LS_SCORE))||0;
    var best=parseInt(localStorage.getItem(LS_BEST))||0;
    var coins=parseFloat(localStorage.getItem(LS_COINS))||0;
    var upgLvl=parseInt(localStorage.getItem(LS_UPG))||0;
    var countdownId=null;

    /* Helpers */
    function haptic(t){
        if(!tg||!tg.HapticFeedback)return;
        try{
            if(t==='tap')tg.HapticFeedback.impactOccurred('light');
            if(t==='ok')tg.HapticFeedback.notificationOccurred('success');
            if(t==='err')tg.HapticFeedback.notificationOccurred('error');
        }catch(_){}
    }
    function save(){
        localStorage.setItem(LS_SCORE,String(score));
        localStorage.setItem(LS_COINS,String(coins));
        localStorage.setItem(LS_UPG,String(upgLvl));
        if(score>best){best=Math.floor(score);localStorage.setItem(LS_BEST,String(best))}
    }
    function upgCost(){return Math.round(BASE_COST*Math.pow(COST_MULT,upgLvl))}
    function fmt(n){return Math.floor(n).toLocaleString('ru-RU')}

    function ui(){
        scoreEl.textContent=fmt(score);
        coinsEl.textContent='🪙 '+fmt(coins);
        incomeEl.textContent='+'+upgLvl+' / сек';
        bestEl.textContent=fmt(best);
        upgLevel.textContent=upgLvl;
        var cost=upgCost();
        upgBuy.textContent='Купить — 🪙 '+fmt(cost);
        upgBuy.disabled=coins<cost;
    }

    /* Nav */
    function go(id){
        screens.forEach(function(s){s.classList.remove('active')});
        document.getElementById(id).classList.add('active');
        navBtns.forEach(function(b){b.classList.toggle('active',b.dataset.scr===id)});
    }
    navBtns.forEach(function(b){
        b.addEventListener('pointerdown',function(e){e.preventDefault();go(b.dataset.scr)});
    });

    /* Tap */
    tapBtn.addEventListener('pointerdown',function(e){
        e.preventDefault();
        score++;coins++;
        scoreEl.textContent=fmt(score);
        coinsEl.textContent='🪙 '+fmt(coins);

        scoreEl.classList.remove('pop');void scoreEl.offsetWidth;scoreEl.classList.add('pop');

        flashEl.classList.remove('fire');void flashEl.offsetWidth;flashEl.classList.add('fire');

        var rect=tapBtn.getBoundingClientRect();
        var cx=(e.clientX||rect.left+rect.width/2)-rect.left;
        var cy=(e.clientY||rect.top+rect.height/2)-rect.top;
        var rip=document.createElement('span');
        rip.className='ripple';var sz=60;
        rip.style.width=sz+'px';rip.style.height=sz+'px';
        rip.style.left=(cx-sz/2)+'px';rip.style.top=(cy-sz/2)+'px';
        tapBtn.appendChild(rip);setTimeout(function(){rip.remove()},500);

        if(Math.floor(score)%SAVE_EVERY===0)save();
        if(score>best){best=Math.floor(score);bestEl.textContent=fmt(best)}
        haptic('tap');
    });

    /* Upgrade */
    upgBuy.addEventListener('pointerdown',function(e){
        e.preventDefault();
        var cost=upgCost();
        if(coins<cost){haptic('err');return}
        coins-=cost;upgLvl++;
        save();ui();haptic('ok');
    });

    /* Reset */
    resetBtn.addEventListener('pointerdown',function(e){
        e.preventDefault();
        modal.classList.add('active');
        var sec=5;
        mConfirm.disabled=true;
        mConfirm.textContent='Продолжить ('+sec+')';
        if(countdownId)clearInterval(countdownId);
        countdownId=setInterval(function(){
            sec--;
            if(sec<=0){clearInterval(countdownId);countdownId=null;mConfirm.disabled=false;mConfirm.textContent='Продолжить'}
            else{mConfirm.textContent='Продолжить ('+sec+')'}
        },1000);
    });
    mCancel.addEventListener('pointerdown',function(e){
        e.preventDefault();modal.classList.remove('active');
        if(countdownId){clearInterval(countdownId);countdownId=null}
    });
    document.getElementById('modal-bg').addEventListener('pointerdown',function(e){
        e.preventDefault();modal.classList.remove('active');
        if(countdownId){clearInterval(countdownId);countdownId=null}
    });
    mConfirm.addEventListener('pointerdown',function(e){
        e.preventDefault();
        if(mConfirm.disabled)return;
        score=0;coins=0;upgLvl=0;best=0;
        localStorage.removeItem(LS_SCORE);localStorage.removeItem(LS_BEST);
        localStorage.removeItem(LS_COINS);localStorage.removeItem(LS_UPG);
        ui();modal.classList.remove('active');haptic('ok');
    });

    /* Auto-income (level coins/sec, tick every 100ms) */
    setInterval(function(){
        if(upgLvl>0){
            var add=upgLvl/10;
            score+=add;coins+=add;
            scoreEl.textContent=fmt(score);
            coinsEl.textContent='🪙 '+fmt(coins);
            if(score>best){best=Math.floor(score);bestEl.textContent=fmt(best)}
        }
    },100);

    /* Save on close */
    window.addEventListener('beforeunload',save);
    window.addEventListener('pagehide',save);

    /* Init */
    if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(_){}try{tg.lockOrientation()}catch(_){}}
    ui();
})();
</script>
