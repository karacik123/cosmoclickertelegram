<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cosmos Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #a78bfa;
            --accent-glow: rgba(167, 139, 250, 0.5);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html, body {
            height: 100%; width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-user-select: none; user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #050510;
            color: #fff;
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
        }

        /* ═══════════ ANIMATED BACKGROUND ═══════════ */
        .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }

        .orb {
            position: absolute; border-radius: 50%;
            filter: blur(80px); opacity: 0.5;
            will-change: transform;
        }
        .orb--1 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
            top: -8%; left: -10%;
            animation: d1 13s ease-in-out infinite alternate;
        }
        .orb--2 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            bottom: -5%; right: -10%;
            animation: d2 17s ease-in-out infinite alternate;
        }
        .orb--3 {
            width: 220px; height: 220px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            top: 40%; left: 50%;
            animation: d3 19s ease-in-out infinite alternate;
        }
        .orb--4 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
            top: 15%; right: 5%;
            animation: d4 15s ease-in-out infinite alternate;
        }
        .orb--5 {
            width: 180px; height: 180px;
            background: radial-gradient(circle, #10b981 0%, transparent 70%);
            bottom: 20%; left: 5%;
            animation: d5 21s ease-in-out infinite alternate;
        }

        @keyframes d1 { to { transform: translate(55vw, 35vh) scale(1.2); } }
        @keyframes d2 { to { transform: translate(-45vw, -35vh) scale(1.15); } }
        @keyframes d3 { to { transform: translate(-25vw, -40vh) scale(0.85); } }
        @keyframes d4 { to { transform: translate(-35vw, 45vh) scale(1.3); } }
        @keyframes d5 { to { transform: translate(40vw, -30vh) scale(1.1); } }

        /* ═══════════ SCREENS ═══════════ */
        .screen {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .screen.active { opacity: 1; pointer-events: auto; }

        /* ═══════════ GLASS PANEL ═══════════ */
        .glass {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(22px) saturate(170%);
            -webkit-backdrop-filter: blur(22px) saturate(170%);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 24px;
            position: relative; overflow: hidden;
        }
        .glass::before {
            content: '';
            position: absolute; inset: 0;
            border-radius: inherit;
            background: linear-gradient(155deg,
                rgba(255,255,255,0.14) 0%,
                rgba(255,255,255,0.03) 35%,
                transparent 55%);
            pointer-events: none; z-index: 1;
        }
        .glass::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 50%; border-radius: inherit;
            background: linear-gradient(to top, rgba(0,0,0,0.12), transparent);
            pointer-events: none; z-index: 1;
        }

        /* ═══════════ LIQUID GLASS BUTTON ═══════════ */

        .liquid-btn {
            position: relative;
            width: 220px; height: 220px;
            border-radius: 50%;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            z-index: 2;
            transition: transform 0.35s var(--spring);
        }
        .liquid-btn:active { transform: scale(0.92); }

        /* — Glass surface (the actual visible face) — */
        .liquid-btn__surface {
            position: absolute; inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(ellipse 70% 50% at 35% 20%,
                    rgba(255,255,255,0.28) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 65% 75%,
                    rgba(255,255,255,0.08) 0%, transparent 50%),
                rgba(255,255,255,0.06);
            backdrop-filter: blur(28px) saturate(200%) brightness(1.08);
            -webkit-backdrop-filter: blur(28px) saturate(200%) brightness(1.08);
            border: 1.5px solid rgba(255,255,255,0.28);
            box-shadow:
                inset 0 2px 3px rgba(255,255,255,0.35),
                inset 0 -3px 6px rgba(0,0,0,0.12),
                0 10px 40px rgba(0,0,0,0.25),
                0 0 0 1px rgba(255,255,255,0.05);
            filter: url(#liquid);
            overflow: hidden;
            z-index: 2;
        }

        /* — Top specular highlight (sharp reflection) — */
        .liquid-btn__surface::before {
            content: '';
            position: absolute;
            top: 7%; left: 14%; right: 14%;
            height: 32%;
            border-radius: 50%;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.55) 0%,
                rgba(255,255,255,0.12) 50%,
                transparent 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* — Bottom caustic reflection — */
        .liquid-btn__surface::after {
            content: '';
            position: absolute;
            bottom: 10%; left: 22%; right: 22%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(ellipse,
                rgba(255,255,255,0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 5;
        }

        /* — Moving caustic light streak — */
        .liquid-btn__caustic {
            position: absolute; inset: 0;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
            z-index: 4;
        }
        .liquid-btn__caustic::before {
            content: '';
            position: absolute;
            top: -60%; left: -20%;
            width: 55%; height: 220%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255,255,255,0.06) 40%,
                rgba(255,255,255,0.12) 50%,
                rgba(255,255,255,0.06) 60%,
                transparent 100%);
            transform: rotate(20deg);
            animation: causticSweep 5s ease-in-out infinite;
        }
        @keyframes causticSweep {
            0%   { transform: rotate(20deg) translateX(-120%); }
            100% { transform: rotate(20deg) translateX(320%); }
        }

        /* — Fresnel edge ring (inner glow at rim) — */
        .liquid-btn__edge {
            position: absolute; inset: 1px;
            border-radius: 50%;
            box-shadow:
                inset 0 0 20px rgba(255,255,255,0.06),
                inset 0 0 2px rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 3;
        }

        /* — Outer glow halo — */
        .liquid-btn__halo {
            position: absolute; inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle,
                var(--accent-glow) 0%,
                rgba(167,139,250,0.15) 40%,
                transparent 65%);
            opacity: 0.25;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 0;
            animation: haloPulse 3s ease-in-out infinite;
        }
        @keyframes haloPulse {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50%      { opacity: 0.35; transform: scale(1.04); }
        }
        .liquid-btn:active .liquid-btn__halo {
            opacity: 0.7;
            animation: none;
        }

        /* — Tap flash (white burst on tap) — */
        .liquid-btn__flash {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255,255,255,0.5) 0%,
                rgba(255,255,255,0.1) 40%,
                transparent 65%);
            opacity: 0;
            pointer-events: none;
            z-index: 6;
        }
        .liquid-btn__flash.fire {
            animation: flashBurst 0.3s ease-out forwards;
        }
        @keyframes flashBurst {
            0%   { opacity: 0.9; transform: scale(0.7); }
            100% { opacity: 0; transform: scale(1.1); }
        }

        /* — Ripple — */
        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transform: scale(0);
            animation: rippleOut 0.55s ease-out forwards;
            pointer-events: none; z-index: 7;
        }
        @keyframes rippleOut {
            to { transform: scale(3.5); opacity: 0; }
        }

        /* — Image inside glass surface — */
        .liquid-btn__img {
            position: absolute;
            top: 8%; left: 8%;
            width: 84%; height: 84%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 4;
            filter: brightness(1.15) contrast(1.05);
            -webkit-user-drag: none;
        }

        /* ═══════════ START SCREEN ═══════════ */
        .title {
            font-size: 38px; font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #e0e7ff 0%, #c4b5fd 50%, #a78bfa 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 2; position: relative;
        }
        .subtitle {
            font-size: 15px; opacity: 0.5;
            margin-bottom: 32px; z-index: 2; position: relative;
            font-weight: 500;
        }

        .start-best {
            padding: 20px 28px; text-align: center;
            margin-bottom: 32px; max-width: 260px; width: 100%;
        }
        .start-best__label {
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 2px; opacity: 0.4;
            margin-bottom: 6px; position: relative; z-index: 2;
        }
        .start-best__value {
            font-size: 44px; font-weight: 800;
            position: relative; z-index: 2;
        }

        .btn-start {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 16px 48px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 50px;
            color: #fff; font-size: 17px; font-weight: 700;
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.2s var(--spring);
            outline: none; z-index: 2;
        }
        .btn-start::before {
            content: '';
            position: absolute; inset: 0; border-radius: inherit;
            background: linear-gradient(160deg,
                rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.03) 40%, transparent 55%);
            pointer-events: none; z-index: 1;
        }
        .btn-start:active { transform: scale(0.95); }

        /* ═══════════ PLAY SCREEN ═══════════ */
        .play-score {
            font-size: 80px; font-weight: 900;
            line-height: 1; margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
            position: relative; z-index: 2;
        }
        .play-score.pop { animation: popScore 0.15s var(--spring); }
        @keyframes popScore {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .play-label {
            font-size: 13px; text-transform: uppercase;
            letter-spacing: 2.5px; opacity: 0.35;
            margin-bottom: 24px; z-index: 2; position: relative;
            font-weight: 600;
        }

        .play-best {
            margin-top: 24px; font-size: 14px;
            opacity: 0.35; z-index: 2; position: relative;
            font-weight: 500;
        }
        .play-best span { font-weight: 700; opacity: 1; color: var(--accent); }

        .play-spacer {
            flex: 1; display: flex;
            align-items: center; justify-content: center;
        }

        /* ═══════════ RESPONSIVE ═══════════ */
        @media (max-height: 650px) {
            .liquid-btn { width: 180px; height: 180px; }
            .play-score { font-size: 60px; }
            .title { font-size: 30px; }
        }
        @media (max-height: 520px) {
            .liquid-btn { width: 140px; height: 140px; }
            .play-score { font-size: 48px; }
            .play-label { font-size: 11px; margin-bottom: 16px; }
            .play-best { margin-top: 16px; font-size: 12px; }
        }
        @media (min-height: 800px) {
            .liquid-btn { width: 260px; height: 260px; }
        }
    </style>
</head>
<body>

    <!-- ═══ Background ═══ -->
    <div class="bg">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>
        <div class="orb orb--4"></div>
        <div class="orb orb--5"></div>
    </div>

    <!-- ═══ SVG Filters ═══ -->
    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <filter id="liquid">
                <feTurbulence type="fractalNoise" baseFrequency="0.018"
                              numOctaves="3" seed="5" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise"
                                   scale="5" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <!-- ═══ Start Screen ═══ -->
    <div id="scr-start" class="screen active">
        <h1 class="title">Cosmos Tap</h1>
        <p class="subtitle">Нажимай. Быстрее. Ещё.</p>

        <div class="start-best glass">
            <div class="start-best__label">Рекорд</div>
            <div class="start-best__value" id="start-best">0</div>
        </div>

        <button class="btn-start" id="btn-go">Играть</button>
    </div>

    <!-- ═══ Play Screen ═══ -->
    <div id="scr-play" class="screen">
        <div class="play-score" id="score">0</div>
        <div class="play-label">нажатий</div>

        <div class="play-spacer">

                <div class="liquid-btn__halo"></div>

        <div class="play-best">Рекорд: <span id="play-best">0</span></div>
    </div>

    <script>
    (function () {
        'use strict';

        var LS = 'cosmos_tap_best';
        var SAVE_EVERY = 5;

        var tg = window.Telegram && window.Telegram.WebApp;

        /* DOM */
        var scrStart   = document.getElementById('scr-start');
        var scrPlay    = document.getElementById('scr-play');
        var startBest  = document.getElementById('start-best');
        var btnGo      = document.getElementById('btn-go');
        var scoreEl    = document.getElementById('score');
        var tapBtn     = document.getElementById('tap');
        var flashEl    = document.getElementById('flash');
        var playBest   = document.getElementById('play-best');

        /* State */
        var score = 0;
        var best  = parseInt(localStorage.getItem(LS)) || 0;

        /* Helpers */
        function haptic(t) {
            if (!tg || !tg.HapticFeedback) return;
            try {
                if (t === 'tap')   tg.HapticFeedback.impactOccurred('light');
                if (t === 'win')   tg.HapticFeedback.notificationOccurred('success');
            } catch (_) {}
        }

        function show(name) {
            scrStart.classList.remove('active');
            scrPlay.classList.remove('active');
            (name === 'start' ? scrStart : scrPlay).classList.add('active');
        }

        function save() {
            if (score > best) {
                best = score;
                localStorage.setItem(LS, String(best));
            }
        }

        /* Init */
        if (tg) {
            tg.ready();
            tg.expand();
            try { tg.disableVerticalSwipes(); } catch (_) {}
            try { tg.lockOrientation(); } catch (_) {}
        }

        startBest.textContent = best;

        btnGo.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            haptic('tap');
            score = 0;
            scoreEl.textContent = '0';
            playBest.textContent = best;
            show('play');
        });

        tapBtn.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            if (!scrPlay.classList.contains('active')) return;

            score++;
            scoreEl.textContent = score;

            /* Score pop */
            scoreEl.classList.remove('pop');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('pop');

            /* Flash */
            flashEl.classList.remove('fire');
            void flashEl.offsetWidth;
            flashEl.classList.add('fire');

            /* Ripple */
            var rect = tapBtn.getBoundingClientRect();
            var cx = (e.clientX || rect.left + rect.width / 2) - rect.left;
            var cy = (e.clientY || rect.top + rect.height / 2) - rect.top;
            var rip = document.createElement('span');
            rip.className = 'ripple';
            var sz = 60;
            rip.style.width = sz + 'px';
            rip.style.height = sz + 'px';
            rip.style.left = (cx - sz / 2) + 'px';
            rip.style.top = (cy - sz / 2) + 'px';
            tapBtn.appendChild(rip);
            setTimeout(function () { rip.remove(); }, 550);

            /* Save periodically */
            if (score % SAVE_EVERY === 0) save();
            playBest.textContent = Math.max(best, score);

            haptic('tap');
        });

        /* Save on close */
        window.addEventListener('beforeunload', save);
        if (tg) {
            window.addEventListener('pagehide', save);
        }
    })();
    </script>
